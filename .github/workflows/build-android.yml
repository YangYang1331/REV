name: REV Android APK (Ubuntu 云构建)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: flutter pub get

      # 正式签名优先级：
      # 1) 仓库内 signing/rev-debug.keystore（密钥取回后自动可用，SHA-256 前缀 3f16feb）
      # 2) 仓库 Secret KEYSTORE_BASE64（备用）
      # 都没有则 build.gradle 自动回退 debug 签名（可安装调试包）。
      - name: 准备正式签名（仓库内 signing 密钥）
        run: |
          set -e
          if [ -f signing/rev-debug.keystore ]; then
            cp signing/key.properties android/key.properties
            echo "已使用仓库内 signing/rev-debug.keystore 正式签名"
          else
            echo "signing/rev-debug.keystore 缺失，稍后尝试 Secret"
          fi

      - name: 准备正式签名（Secret 备用）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' && hashFiles('signing/rev-debug.keystore') == '' }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > android/rev-release.jks
          cat > android/key.properties <<EOF
          storeFile=rev-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已使用 Secret 写入正式签名配置"

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: REV-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
