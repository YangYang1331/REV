name: REV Android APK (Ubuntu 云构建)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: flutter pub get

      # 若仓库配了签名密钥 Secret，则写入 key.properties 出正式签名包；
      # 没配则 build.gradle 自动回退 debug 签名（可安装调试包）。
      - name: 准备正式签名密钥（可选）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > android/rev-release.jks
          cat > android/key.properties <<EOF
          storeFile=rev-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已写入正式签名配置"

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: REV-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
