name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 静态检查
        run: flutter analyze --no-fatal-infos
      - name: 单元测试（golden 默认跳过）
        run: flutter test
      - name: Golden 快照（可选，需 --dart-define=RUN_GOLDEN=true）
        if: ${{ vars.RUN_GOLDEN == 'true' }}
        run: flutter test test/skin_golden_test.dart --dart-define=RUN_GOLDEN=true

  audio-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 声音素材体检依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy scipy
      - name: 响度/真峰值/接缝/清单完整性
        run: python3 scripts/audio_check.py
      - name: 上传体检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-check-report
          path: /tmp/audio_check.json
